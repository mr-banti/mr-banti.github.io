<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRABODHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="image/PRABODHA%20-%20LOGObg.png">
<style>
  :root{
    --paper:#f4e3ce;
    --paper-shade:#ecd5b8;
    --ink:#1a1a1a;
    --ink-soft:#3a3632;
    --rule:#b7ac95;
    --rule-strong:#1a1a1a;
    --red:#7a2020;
    --blue:#1c3a5e;
  }
  [data-theme="dark"]{
    --paper:#1b1a17;
    --paper-shade:#232019;
    --ink:#ece6d9;
    --ink-soft:#b8afa0;
    --rule:#4a463c;
    --rule-strong:#ece6d9;
    --red:#d9615c;
    --blue:#7aa9d1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    transition:background .2s, color .2s;
  }
  .hub-toolbar{
    position:fixed;
    top:16px;
    right:20px;
  }
  .theme-toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    font-weight:700;
    padding:8px 14px;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    border-radius:3px;
  }
  .theme-toggle:hover{background:var(--ink); color:var(--paper);}

  .hub{
    width:100%;
    max-width:480px;
    padding:40px 32px 44px;
    text-align:center;
  }
  .hub-logo-img{
    width:72px;
    height:72px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--paper-shade);
    margin-bottom:14px;
  }
  .hub-logo{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .hub-title{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:44px;
    letter-spacing:0.02em;
    margin:0 0 6px;
  }
  .hub-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin-bottom:34px;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
  }

  .hub-links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .hub-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    border:1px solid var(--ink);
    background:var(--paper-shade);
    color:var(--ink);
    text-decoration:none;
    border-radius:4px;
    transition:background .15s, color .15s, transform .15s;
  }
  .hub-link:hover{
    background:var(--ink);
    color:var(--paper);
    transform:translateY(-2px);
  }
  .hub-link-text{
    text-align:left;
  }
  .hub-link-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    display:block;
  }
  .hub-link-desc{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    display:block;
    margin-top:2px;
  }
  .hub-link:hover .hub-link-desc{color:var(--paper);}
  .hub-arrow{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
    flex-shrink:0;
  }

  .hub-footer{
    margin-top:34px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }
</style>
</head>

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0J1DPM3Y95"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-0J1DPM3Y95');
</script>
  
<body>

<div class="hub-toolbar">
  <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
</div>

<div class="hub">
  <img src="image\PRABODHA - LOGO.png" alt="PRABODHA Logo" class="hub-logo-img">
  <div class="hub-logo">AWAKENING THROUGH KNOWLEDGE</div>
  <h1 class="hub-title">PRABODHA</h1>
  <div class="hub-sub">THE RECORD OF TECHNOLOGY, SCIENCE &amp; INNOVATION</div>

  <div class="hub-links">
    <a class="hub-link" href="https://mr-banti.github.io/prabodha/">
      <span class="hub-link-text">
        <span class="hub-link-name">NEWSPAPER</span>
        <span class="hub-link-desc">MONTHLY ISSUE</span>
      </span>
      <span class="hub-arrow">→</span>
    </a>

    <a class="hub-link" href="https://mr-banti.github.io/prabodha-online/">
      <span class="hub-link-text">
        <span class="hub-link-name">NEWSROOM</span>
        <span class="hub-link-desc">DAILY ISSUE</span>
      </span>
      <span class="hub-arrow">→</span>
    </a>


  <div class="hub-footer">© <span id="copyYear"></span> PRABODHA. All Rights Reserved.</div>
</div>

<script>
  (function(){
    var t = localStorage.getItem("prabodha-theme") || "light";
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();

  function toggleTheme() {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark";
    if (isDark) { root.removeAttribute("data-theme"); localStorage.setItem("prabodha-theme", "light"); }
    else { root.setAttribute("data-theme", "dark"); localStorage.setItem("prabodha-theme", "dark"); }
    updateThemeBtn();
  }
  function updateThemeBtn() {
    const btn = document.getElementById("themeToggle");
    if (!btn) return;
    btn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
  }
  updateThemeBtn();

  document.getElementById("copyYear").textContent = new Date().getFullYear();
</script>

</body>
</html>
